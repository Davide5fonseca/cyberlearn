name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: API (lint + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyberlearn/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cyberlearn/server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          JWT_SECRET: ci-apenas-para-testes
          NODE_ENV: test

  frontend:
    name: Frontend (lint + testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyberlearn/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cyberlearn/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
